    <style>
        :root {
            --bg-white: #ffffff;
            --bg-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --primary-navy: #1a3a6b;
            --primary-blue: #2563eb;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Main background color is white as requested */
            background-color: var(--bg-white);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Typography */
        h1, h2, h3 {
            font-weight: 700;
            color: var(--primary-navy);
        }

        .highlight-text {
            color: var(--primary-blue);
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 5rem 0;
        }

        /* Hero Section with Background Image */
        .hero {
            position: relative;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Corporate building background with a dark overlay to make text readable */
            background: linear-gradient(rgba(26, 58, 107, 0.85), rgba(26, 58, 107, 0.9)), 
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=2070&q=80') center/cover fixed;
            color: var(--bg-white);
            padding: 0 2rem;
        }

        .hero h1 {
            font-size: 4rem;
            color: var(--bg-white);
            margin-bottom: 1rem;
            animation: fadeInDown 1s ease;
        }

        .typewriter-container {
            font-size: 1.5rem;
            font-weight: 500;
            color: #93c5fd;
            margin-bottom: 2rem;
            min-height: 2.5rem;
        }

        .hero p {
            max-width: 800px;
            font-size: 1.1rem;
            color: #e2e8f0;
            animation: fadeInUp 1s ease 0.3s forwards;
            opacity: 0;
        }

        /* Mission & Vision - Overlapping Cards */
        .overlap-section {
            margin-top: -100px; /* Pulls cards up over the hero image */
            position: relative;
            z-index: 10;
            padding: 0 0 5rem 0;
        }

        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .info-card {
            background: var(--bg-white);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            position: relative;
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
        }

        /* Top accent bar for cards */
        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--primary-blue);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .info-card h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .info-card h2 i {
            font-size: 2.2rem;
            color: var(--primary-blue);
            background: #eff6ff;
            padding: 10px;
            border-radius: 12px;
        }

        .info-card p {
            color: var(--text-muted);
        }

        /* Why Choose Us Section */
        .features-section {
            background-color: var(--bg-white);
        }

        .features-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .features-header h2 {
            font-size: 2.5rem;
        }

        .features-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .feature-box {
            background: var(--bg-white);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
        }

        .feature-box:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.1);
        }

        .icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--primary-blue);
            margin-bottom: 1.5rem;
        }

        .feature-box h3 {
            font-size: 1.15rem;
            color: var(--text-dark);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .split-grid {
                grid-template-columns: 1fr;
            }
            .hero h1 {
                font-size: 3rem;
            }
            .overlap-section {
                margin-top: -50px;
                padding: 0 1rem 3rem 1rem;
            }
        }
    </style>
</head>
