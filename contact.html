  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border-color: #e2e8f0;
      --navy: #0f172a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Hero Section with Background Image */
    .contact-hero {
      position: relative;
      background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)),
                  url('/assest/images/contact_hero.png') center/cover no-repeat fixed;
      padding: 120px 0 80px;
      text-align: center;
      color: #ffffff;
    }

    .hero-heading {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      animation: fadeInDown 0.8s ease-out;
    }

    .hero-sub {
      font-size: 1.2rem;
      color: #cbd5e1;
      max-width: 600px;
      margin: 0 auto;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    /* Split Layout for Contact */
    .contact-section {
      padding: 80px 0;
      background-color: var(--bg-secondary);
    }

    .split-layout {
      display: flex;
      gap: 0;
      background: var(--bg-primary);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      transform: translateY(-40px); /* Pulls it up slightly into the hero section */
    }

    /* Left Side - Info */
    .contact-info {
      flex: 1;
      background: var(--navy);
      color: white;
      padding: 4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Decorative circle in the info panel */
    .contact-info::after {
      content: '';
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: rgba(37, 99, 235, 0.2);
      border-radius: 50%;
      z-index: 0;
    }

    .info-content {
      position: relative;
      z-index: 1;
    }

    .info-header h3 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    .info-header p {
      color: #94a3b8;
      margin-bottom: 3rem;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .info-icon {
      font-size: 1.8rem;
      color: #60a5fa;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 12px;
    }

    .info-details strong {
      display: block;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .info-details a, .info-details span {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.3s;
    }

    .info-details a:hover {
      color: #60a5fa;
    }

    /* Social Links */
    .social-links {
      margin-top: 3rem;
      display: flex;
      gap: 1rem;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 50%;
      font-size: 1.5rem;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .social-links a:hover {
      background: var(--accent);
      transform: translateY(-3px);
    }

    /* Right Side - Form */
    .contact-form-wrapper {
      flex: 1.3;
      padding: 4rem;
    }

    .contact-form-wrapper h3 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .form-subtitle {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .form-group input, 
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #f8fafc;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
      color: var(--text-main);
    }

    .form-group input:focus, 
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }

    /* FAQ Section */
    .faq-section {
      padding: 4rem 0 6rem;
      background: var(--bg-primary);
    }

    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-header h2 {
      font-size: 2.5rem;
      color: var(--navy);
      margin-bottom: 1rem;
    }

    .faq-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .faq-card {
      background: var(--bg-secondary);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .faq-card h4 {
      font-size: 1.2rem;
      color: var(--navy);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .faq-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Map Section */
    .map-container {
      padding: 0 2rem 6rem;
    }

    .map-section {
      height: 450px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .split-layout {
        flex-direction: column;
        transform: translateY(-20px);
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .contact-info, .contact-form-wrapper {
        padding: 2.5rem;
      }
      .contact-hero {
        padding: 100px 0 60px;
      }
    }
  </style>
</head>
